<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>

    <style>
        body{
            font-family: Georgia, serif;
            margin:100px 400px;
            background:#ffffff;
        }
        .back-btn {
            display: inline-block;
            margin: 20px;
            padding: 8px 16px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .back-btn:hover {
            background-color: #555;
        }


        .container{
            width:700px;
            border:1px solid #ccc;
            padding:30px;
            box-shadow:0 0 5px rgba(0,0,0,.2);
        }

        h2{
            font-size:30px;
            margin-top:0;
        }

        label{
            font-size:24px;
        }

        input{
            width:350px;
            padding:8px;
            font-size:24px;
        }

        button{
            padding:8px 18px;
            font-size:20px;
            cursor:pointer;
        }

        #result{
            margin-top:30px;
            font-size:22px;
            line-height:1.8;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='index.html'">&larr; Back to index</button>



<div class="container">

    <h2>Calculate Change</h2>

    <label>Enter Amount:</label>

    <input type="number" id="amount">

    <button onclick="calculateChange()">Submit</button>

    <div id="result"></div>

</div>

<script>

function calculateChange(){

    let amount = parseInt(document.getElementById("amount").value);

    if(isNaN(amount) || amount < 0){
        document.getElementById("result").innerHTML =
        "Please enter a valid amount.";
        return;
    }

    const money = [1000,500,100,50,20,10,5,2,1];

    let output = "";

    for(let i=0;i<money.length;i++){

        let count = Math.floor(amount / money[i]);

        if(count > 0){

            output += count + " of ฿" + money[i] + "<br>";

            amount %= money[i];
        }

    }

    document.getElementById("result").innerHTML = output;

}

</script>

</body>
</html>
